services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-web:/var/lib/odoo
      - ./payment_mypay:/mnt/extra-addons/payment_mypay
      - ./pos_mypay:/mnt/extra-addons/pos_mypay
    command:
      [
        "--dev=reload",
        "--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons",
      ]

  # Named Cloudflare Tunnel only (requires TUNNEL_TOKEN in .env).
  # For a one-off trycloudflare.com URL, use: ./scripts/dev-webhook-tunnel.sh
  # In the Cloudflare dashboard, point the tunnel hostname at http://odoo:8069
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    depends_on:
      - odoo
    environment:
      # Required only with: docker compose --profile tunnel up
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-web:
